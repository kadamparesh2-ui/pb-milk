<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PB Milk Delivery</title>
    <style>
        /* Simple styling for the form */
        body { font-family: sans-serif; padding: 20px; }
        .form-container { max-width: 400px; margin: auto; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        #error-message { color: red; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Login to Your Account</h2>
            
        <input type="email" id="login-email" placeholder="Email Address" required>
        <input type="password" id="login-password" placeholder="Password" required>
            
        <button id="login-button">Login</button>

        <p id="error-message"></p>
        <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <!-- Aapki apni JavaScript file -->
    <script src="app.js"></script>

    <!-- Is Page ke liye khaas JavaScript -->
    <script>
        const loginButton = document.getElementById('login-button');
        const loginEmailInput = document.getElementById('login-email');
        const loginPasswordInput = document.getElementById('login-password');
        const errorMessage = document.getElementById('error-message');

        loginButton.addEventListener('click', () => {
            const email = loginEmailInput.value;
            const password = loginPasswordInput.value;

            errorMessage.textContent = ''; // Purani error saaf karo

            if (!email || !password) {
                errorMessage.textContent = 'Please enter both email and password.';
                return;
            }

            // --- YAHAN SAHI LOGIC HAI ---
            // Database padhne ke bajaye, seedhe Firebase Auth se sign-in karein
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Login safal!
                    const user = userCredential.user;
                    console.log('User logged in:', user.uid);
                    alert('Login Successful!');
                        
                    // User ko dashboard ya home page par bhej do
                    window.location.href = 'index.html'; 
                })
                .catch((error) => {
                    // Error handle karein
                    console.error('Login Error:', error.code, error.message);
                    // User ko aasan bhasha mein error dikhao
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                        errorMessage.textContent = 'Incorrect email or password. Please try again.';
                    } else {
                        errorMessage.textContent = error.message;
                    }
                });
        });
    </script>

</body>
</html>
